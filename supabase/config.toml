# HazırGrup — Supabase local geliştirme yapılandırması
# Kurulum: docs/SETUP.md

project_id = "hazirgrup"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local e-posta yakalama arayüzü — gerçek e-posta gönderilmez.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# docs/SECURITY_MODEL.md §8 ile aynı sınır
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/sifre-sifirla"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local geliştirmede e-posta doğrulaması kapalı; üretimde açılmalıdır.
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# Google girişi opsiyoneldir (docs/KNOWN_LIMITATIONS.md L-08).
# Kimlik bilgileri tanımlı değilse uygulama bu sağlayıcıyı hiç göstermez.
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false

[edge_runtime]
enabled = false
